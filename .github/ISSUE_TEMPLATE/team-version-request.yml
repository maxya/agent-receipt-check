name: Team version request
description: Tell us what a team version would need to be useful for your team.
title: "[team-version] "
labels: ["team-version"]
body:
  - type: dropdown
    id: want
    attributes:
      label: What would you want?
      options:
        - run history
        - alerts
        - shared receipt log
        - other
    validations:
      required: true
  - type: input
    id: team-size
    attributes:
      label: Team size
      description: Roughly how many developers would use it?
      placeholder: "e.g. 5"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: How you would use it, what you use today, or what is missing.
      render: text
    validations:
      required: false
